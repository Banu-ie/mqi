# Render Blueprint — deploys the backend, the static frontend, and a persistent
# disk for the SQLite database in one go.
#
# Apply with:  Render dashboard → New → Blueprint → point at this repository.
#
# IMPORTANT: a persistent disk requires a paid instance type. On the free tier
# the filesystem is wiped on every deploy and all data is lost, so the disk
# below is what makes SQLite viable in production.
services:
  - type: web
    name: mqicma-backend
    runtime: node
    plan: starter          # required for `disk`; free plans have no persistence
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: mqicma-sqlite
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/data/mqicma.db
      - key: JWT_SECRET
        generateValue: true   # Render generates and stores a strong secret
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGIN
        sync: false           # set to the deployed frontend origin
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: mqicma-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false           # https://<backend-host>/api
    routes:
      # Single-page app: every unmatched path must serve index.html, otherwise a
      # refresh on /mehsullar or /admin/dashboard returns a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
