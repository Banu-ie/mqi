# Render Blueprint — a single web service serving the API and the built React app.
#
# Apply with:  Render dashboard → New → Blueprint → point at this repository.
#
# One service means one origin: the React bundle calls same-origin /api, so there
# is no CORS to configure and no backend hostname baked into the frontend or into
# this file. Whatever URL Render assigns, the site works — nothing here has to be
# edited after the first deploy, and a custom domain needs no rebuild.
#
# State lives in managed PostgreSQL (Neon), so the service is stateless, with the
# single exception of image uploads — see the `disk` note at the bottom.
services:
  - type: web
    name: mqicma
    runtime: node
    rootDir: backend
    plan: free
    # The deployed service lives here. Note the database is in Neon's
    # ap-southeast-1 (Singapore): `singapore` would put the two next to each
    # other, but a region cannot be changed after a service is created, so this
    # records where it actually is. Measured warm responses are ~250 ms either
    # way, so moving it is not worth recreating the service.
    region: oregon
    # build:all compiles the backend, then builds the frontend and copies it to
    # backend/public, which the server picks up automatically.
    buildCommand: npm ci && npm run build:all
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # Neon pooled connection string (a secret)
      - key: DATABASE_SCHEMA
        value: mqicma
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: JWT_SECRET
        generateValue: true  # Render generates and stores a strong secret
      - key: TRUST_PROXY
        value: "true"        # so rate limiting sees the real client IP
    # Uploaded images are written to backend/uploads. Without a disk they are
    # wiped on every deploy while the database rows keep pointing at them, so
    # admin-uploaded images would turn into broken links. A disk requires a paid
    # instance, so it is left off here: uncomment this block and remove
    # `plan: free` above once uploads need to survive a redeploy.
    #
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1
